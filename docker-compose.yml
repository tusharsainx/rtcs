# AI-generated: docker-compose configuration for orchestration of the dynamically scalable environment
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-chatapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chatapp}
      POSTGRES_DB: ${DB_DATABASE:-chatapp}
    ports:
      - "5432:5432"          # host access for local debugging/testing only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"          # host access for local debugging/testing only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- User Service Instances ----------
  user-service-1:
    build: ./backend/user-service
    image: rtcs-user-service:latest
    environment:
      DB_USER: ${DB_USER:-chatapp}
      DB_PASSWORD: ${DB_PASSWORD:-chatapp}
      DB_DATABASE: ${DB_DATABASE:-chatapp}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      PORT: "4000"
    depends_on:
      - postgres
    restart: on-failure

  user-service-2:
    build: ./backend/user-service
    image: rtcs-user-service:latest
    environment:
      DB_USER: ${DB_USER:-chatapp}
      DB_PASSWORD: ${DB_PASSWORD:-chatapp}
      DB_DATABASE: ${DB_DATABASE:-chatapp}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      PORT: "4000"
    depends_on:
      - postgres
    restart: on-failure

  # ---------- Chat Service Instances ----------
  chat-service-1:
    build: ./backend/chat-service
    image: rtcs-chat-service:latest
    environment:
      DB_USER: ${DB_USER:-chatapp}
      DB_PASSWORD: ${DB_PASSWORD:-chatapp}
      DB_DATABASE: ${DB_DATABASE:-chatapp}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      PORT: "4000"
    depends_on:
      - postgres
      - redis
    restart: on-failure

  chat-service-2:
    build: ./backend/chat-service
    image: rtcs-chat-service:latest
    environment:
      DB_USER: ${DB_USER:-chatapp}
      DB_PASSWORD: ${DB_PASSWORD:-chatapp}
      DB_DATABASE: ${DB_DATABASE:-chatapp}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      PORT: "4000"
    depends_on:
      - postgres
      - redis
    restart: on-failure

  # ---------- Frontend React-Vite Service ----------
  frontend:
    build: ./frontend
    image: rtcs-frontend:latest
    environment:
      VITE_USER_SERVICE_URL: http://localhost:8000/user-service/graphql
      VITE_CHAT_SERVICE_URL: http://localhost:8000/chat-service/graphql
      VITE_CHAT_SERVICE_WS_URL: ws://localhost:8000/chat-service/graphql
    restart: on-failure

  # ---------- Nginx Gateway Entrypoint Load Balancer ----------
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service-1
      - user-service-2
      - chat-service-1
      - chat-service-2
      - frontend
    restart: on-failure

volumes:
  pgdata:
