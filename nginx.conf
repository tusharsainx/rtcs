# AI-generated: Nginx configuration for load-balancing user-service, chat-service, and serving frontend
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ---------- User Service Upstream Pool ----------
    upstream user_service_pool {
        server user-service-1:4000;
        server user-service-2:4000;
    }

    # ---------- Chat Service Upstream Pool ----------
    upstream chat_service_pool {
        server chat-service-1:4000;
        server chat-service-2:4000;
    }

    server {
        listen 8000;

        # Route requests to User Service
        location /user-service/ {
            proxy_pass http://user_service_pool/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route requests to Chat Service
        location /chat-service/ {
            proxy_pass http://chat_service_pool/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Required for the WebSocket handshake GraphQL subscriptions use.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;   # keep long-lived WS connections open
        }

        # Route all other requests to Frontend
        location / {
            proxy_pass http://frontend:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Vite WebSocket support for Hot Module Replacement (HMR)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
